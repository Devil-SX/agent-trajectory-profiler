[project]
name = "batcave-trajectory"
version = "6.0.2"
description = "Authenticated remote analysis for the open Trajectory collector protocol"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "black>=24,<27", "mypy>=1.11,<2"]

[project.scripts]
trajectory-server = "trajectory.product.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trajectory", "trajectory.product"]

[tool.setuptools.package-data]
"trajectory.product" = ["dashboard.html", "research.js", "research.css", "schedules.js", "schedules.css"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["trajectory/product"]

[[tool.mypy.overrides]]
module = ["batcave_http.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/product"]
addopts = "--tb=short"
