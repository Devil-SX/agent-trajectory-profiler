name: Current product quality

on:
  workflow_dispatch:

# The registered runner must be an isolated test runner on batcave-wsl. It must
# not run production identities or expose production databases to test jobs.
jobs:
  product-quality:
    runs-on: [self-hosted, linux, batcave-test]
    timeout-minutes: 25
    env:
      BATCAVE_TEST_ROOT: /home/saveer/BatCave/tests
      BATCAVE_HTTP_TEST_PYZ: ${{ vars.BATCAVE_HTTP_TEST_PYZ }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create disposable remote test workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d "$BATCAVE_TEST_ROOT"
          test -n "$BATCAVE_HTTP_TEST_PYZ"
          test -r "$BATCAVE_HTTP_TEST_PYZ"
          test_workspace=$(mktemp -d "$BATCAVE_TEST_ROOT/trajectory-ci-${GITHUB_RUN_ID}-XXXXXX")
          git archive HEAD | tar -x -C "$test_workspace"
          echo "TRAJECTORY_TEST_WORKSPACE=$test_workspace" >> "$GITHUB_ENV"
      - name: Install isolated Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRAJECTORY_TEST_WORKSPACE"
          uv python install 3.12
          uv sync --frozen --group dev
          echo "PYTHONPATH=$BATCAVE_HTTP_TEST_PYZ" >> "$GITHUB_ENV"
      - name: Check current Python source
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRAJECTORY_TEST_WORKSPACE"
          uv run --no-sync ruff check trajectory tests scripts tools
          uv run --no-sync black --check trajectory tests scripts tools
          uv run --no-sync mypy trajectory
      - name: Run current domain and client tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRAJECTORY_TEST_WORKSPACE"
          test_paths=(tests/product)
          if test -d tests/client; then test_paths+=(tests/client); fi
          uv run --no-sync pytest "${test_paths[@]}" --tb=short
      - name: Run current dashboard acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRAJECTORY_TEST_WORKSPACE"
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/playwright install chromium
          mkdir -p browser-evidence
          export PLAYWRIGHT_MODULE="$TRAJECTORY_TEST_WORKSPACE/tests/browser/node_modules/playwright"
          node tests/browser/dashboard-browser.cjs trajectory/product/dashboard.html browser-evidence
          node tests/browser/semantic-analysis-browser.cjs trajectory/product/dashboard.html browser-evidence
      - name: Keep remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-product-${{ github.run_id }}
          path: ${{ env.TRAJECTORY_TEST_WORKSPACE }}/browser-evidence
          if-no-files-found: ignore
